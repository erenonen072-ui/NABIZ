<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haber Ara | NABIZ</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="site-header">

<div class="header-inner">

<a href="/" class="logo">NABIZ</a>

<nav class="main-nav">
<a href="/">Ana Sayfa</a>
<a href="/gundem/">Gündem</a>
<a href="/dunya/">Dünya</a>
<a href="/ekonomi/">Ekonomi</a>
<a href="/spor/">Spor</a>
<a href="/teknoloji/">Teknoloji</a>
<a href="/magazin/">Magazin</a>
<a href="/kultur-sanat/">Kültür-Sanat</a>
</nav>

</div>

</header>

<main class="search-page">

<h1 class="category-title">Haber Ara</h1>

<form class="search-box" id="searchForm">

<input
id="searchInput"
type="search"
placeholder="Haber ara..."
autocomplete="off"
>

<button type="submit">Ara</button>

</form>

<div class="news-grid" id="results"></div>

</main>

<script src="/js/haberler.js"></script>

<script>

const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");
const results = document.getElementById("results");

function slugify(text) {

return text
.toLowerCase()
.replace(/ğ/g,"g")
.replace(/ü/g,"u")
.replace(/ş/g,"s")
.replace(/ı/g,"i")
.replace(/ö/g,"o")
.replace(/ç/g,"c")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

}

form.addEventListener("submit", function(e) {

e.preventDefault();

const query = input.value.toLowerCase().trim();

if (!query) {
results.innerHTML = "<p>Lütfen bir arama yapın.</p>";
return;
}

const found = window.haberler.filter(h =>
h.baslik.toLowerCase().includes(query) ||
h.spot.toLowerCase().includes(query) ||
h.kategori.toLowerCase().includes(query)
);

if (!found.length) {

results.innerHTML = `
<p>Aradığınız haber bulunamadı.</p>
`;

return;

}

results.innerHTML = found.map(h => `

<article class="news-card">

<a href="/haber/${h.id}-${slugify(h.baslik)}/">

<img src="${h.gorsel}" alt="${h.baslik}">

<div class="news-content">

<span class="news-category">
${h.kategori}
</span>

<h3>${h.baslik}</h3>

<p>${h.spot}</p>

</div>

</a>

</article>

`).join("");

});

</script>

</body>
</html>
