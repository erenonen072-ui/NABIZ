<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ffffff">

    <meta name="description" content="NABIZ Haber - Güncel haberler">

    <title>NABIZ Haber</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/haber.css">
</head>

<body>

<header class="header">

    <div class="header-main">

        <a href="/" class="logo">
            <img src="/images/haber.jpg" alt="NABIZ">
        </a>

        <nav class="desktop-nav">

            <a href="/">Ana Sayfa</a>
            <a href="/gundem/">Gündem</a>
            <a href="/dunya/">Dünya</a>
            <a href="/ekonomi/">Ekonomi</a>
            <a href="/spor/">Spor</a>
            <a href="/teknoloji/">Teknoloji</a>
            <a href="/magazin/">Magazin</a>
            <a href="/kultur-sanat/">Kültür-Sanat</a>

        </nav>

        <a href="/arama/" class="search-button" aria-label="Ara">
            🔍
        </a>

    </div>

</header>


<main class="article-page">

    <div class="article-grid">

        <article class="article">

            <div id="articleContent"></div>


            <section class="share-box">

                <div class="share-title">
                    <span></span>
                    <strong>Haberi Paylaş</strong>
                </div>

                <div class="share-buttons">

                    <button id="nativeShare" type="button">
                        ↗ Paylaş
                    </button>

                    <a
                        id="whatsappShare"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >
                        WhatsApp
                    </a>

                    <a
                        id="xShare"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >
                        𝕏
                    </a>

                    <button id="copyShare" type="button">
                        🔗 Linki Kopyala
                    </button>

                </div>

            </section>

        </article>


        <aside class="sidebar">

            <div class="sidebar-card">

                <div class="sidebar-heading">

                    <span></span>

                    <h2>Çok Okunanlar</h2>

                </div>

                <div id="articlePopular"></div>

            </div>

        </aside>

    </div>

</main>


<footer>

    <div class="footer-inner">

        <div class="footer-logo">

            <img src="/images/haber.jpg" alt="NABIZ">

            <p>
                Türkiye ve dünyadan güncel gelişmeler.
            </p>

        </div>

        <div class="footer-links">

            <a href="/hakkimizda/">Hakkımızda</a>
            <a href="/iletisim/">İletişim</a>
            <a href="/gizlilik/">Gizlilik</a>
            <a href="/kullanim-sartlari/">Kullanım Şartları</a>

        </div>

        <div class="footer-copy">
            © 2026 NABIZ
        </div>

    </div>

</footer>


<script src="/js/haberler.js"></script>
<script src="/js/haber.js"></script>

</body>
</html>
