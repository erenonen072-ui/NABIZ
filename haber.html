<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>NABIZ</title>

    <meta
        name="description"
        content="NABIZ haber detay sayfası."
    >

    <meta
        property="og:type"
        content="article"
    >

    <meta
        property="og:site_name"
        content="NABIZ"
    >

    <meta
        property="og:title"
        content="NABIZ"
    >

    <meta
        property="og:description"
        content="NABIZ haber detay sayfası."
    >

    <meta
        property="og:image"
        content="/images/haber.jpg"
    >

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/haber.css"
    >

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="news-header">

    <div class="news-header-inner">

        <a
            href="/"
            class="news-logo"
            aria-label="NABIZ Ana Sayfa"
        >

            <img
                src="/images/haber.jpg"
                alt="NABIZ"
            >

        </a>


        <nav class="news-navigation">

            <a href="/">Ana Sayfa</a>

            <a href="/gundem/">Gündem</a>

            <a href="/dunya/">Dünya</a>

            <a href="/ekonomi/">Ekonomi</a>

            <a href="/spor/">Spor</a>

            <a href="/teknoloji/">Teknoloji</a>

            <a href="/magazin/">Magazin</a>

            <a href="/kultur-sanat/">
                Kültür-Sanat
            </a>

        </nav>


        <a
            href="/arama/"
            class="news-search"
            aria-label="Ara"
        >
            <span></span>
        </a>

    </div>

</header>



<!-- =====================================
     HABER
===================================== -->

<main class="news-article-page">


    <!-- BREADCRUMB -->

    <div class="news-breadcrumb">

        <a href="/">Ana Sayfa</a>

        <span>/</span>

        <span id="breadcrumbCategory">
            Haber
        </span>

    </div>



    <div class="news-article-layout">


        <!-- =================================
             SOL
        ================================= -->

        <article class="news-article-main">


            <div id="articleContent">


                <!-- JS BURAYI DOLDURACAK -->


            </div>



            <!-- =================================
                 PAYLAŞ
            ================================= -->

            <section class="news-share">

                <div class="news-share-title">

                    <span></span>

                    <strong>
                        Bu haberi paylaş
                    </strong>

                </div>


                <div class="news-share-buttons">

                    <button
                        id="nativeShare"
                        type="button"
                    >
                        Paylaş
                    </button>


                    <a
                        id="whatsappShare"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        WhatsApp
                    </a>


                    <a
                        id="xShare"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        𝕏
                    </a>


                    <button
                        id="copyShare"
                        type="button"
                    >
                        Linki Kopyala
                    </button>

                </div>

            </section>



            <!-- =================================
                 BENZER HABERLER
            ================================= -->

            <section class="related-news">

                <div class="section-title">

                    <span></span>

                    <h2>
                        Benzer Haberler
                    </h2>

                </div>


                <div
                    id="relatedNews"
                    class="related-news-grid"
                ></div>

            </section>


        </article>



        <!-- =================================
             SAĞ SIDEBAR
        ================================= -->

        <aside class="news-sidebar">


            <section class="sidebar-box">


                <div class="sidebar-title">

                    <span></span>

                    <h2>
                        Çok Okunanlar
                    </h2>

                </div>


                <div
                    id="articlePopular"
                    class="popular-news-list"
                ></div>


            </section>


        </aside>


    </div>

</main>



<!-- =====================================
     FOOTER
===================================== -->

<footer class="news-footer">

    <div class="news-footer-inner">


        <div class="footer-brand">

            <img
                src="/images/haber.jpg"
                alt="NABIZ"
            >

            <p>
                Türkiye ve dünyadan güncel
                gelişmeler.
            </p>

        </div>


        <div class="footer-menu">

            <a href="/hakkimizda/">
                Hakkımızda
            </a>

            <a href="/iletisim/">
                İletişim
            </a>

            <a href="/gizlilik/">
                Gizlilik
            </a>

            <a href="/kullanim-sartlari/">
                Kullanım Şartları
            </a>

        </div>


        <div class="footer-bottom">

            © 2026 NABIZ

        </div>


    </div>

</footer>



<script src="/js/haberler.js"></script>

<script src="/js/haber.js"></script>


</body>

</html>
