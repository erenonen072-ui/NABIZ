<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NABIZ | Kategori</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>


<body>


<header class="header">

    <div class="main-header">

        <div class="container header-inner">

            <a
                href="index.html"
                class="logo"
            >
                NABIZ<span>.</span>
            </a>


            <nav class="desktop-nav">

                <a href="index.html">
                    Ana Sayfa
                </a>

                <a href="kategori.html?k=Gündem">
                    Gündem
                </a>

                <a href="kategori.html?k=Dünya">
                    Dünya
                </a>

                <a href="kategori.html?k=Ekonomi">
                    Ekonomi
                </a>

                <a href="kategori.html?k=Spor">
                    Spor
                </a>

                <a href="kategori.html?k=Teknoloji">
                    Teknoloji
                </a>

                <a href="kategori.html?k=Magazin">
                    Magazin
                </a>

            </nav>

        </div>

    </div>

</header>


<main class="category-page">

    <div class="container">

        <div class="section-heading">

            <div>

                <small>
                    KATEGORİ
                </small>

                <h1 id="categoryTitle">
                    Tüm Haberler
                </h1>

            </div>

        </div>


        <div
            class="news-grid"
            id="categoryNews"
        ></div>

    </div>

</main>


<script src="js/haberler.js"></script>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const category =
    params.get("k");


const title =
    document.getElementById(
        "categoryTitle"
    );


const container =
    document.getElementById(
        "categoryNews"
    );


title.textContent =
    category ||
    "Tüm Haberler";


const news =
    category

        ? haberler.filter(
            h =>
                h.kategori
                .toLocaleLowerCase(
                    "tr-TR"
                ) ===
                category
                .toLocaleLowerCase(
                    "tr-TR"
                )
        )

        : haberler;


container.innerHTML =
    news.map(
        h => `

        <a
            class="news-card"
            href="haber.html?id=${h.id}"
        >

            <div class="news-image">

                <img
                    src="${h.gorsel}"
                    alt="${h.baslik}"
                    loading="lazy"
                >

                <span>
                    ${h.kategori}
                </span>

            </div>


            <div class="news-content">

                <small>
                    ${h.tarih}
                    ·
                    ${h.saat}
                </small>

                <h3>
                    ${h.baslik}
                </h3>

                <p>
                    ${h.spot}
                </p>

            </div>

        </a>

    `
    )
    .join("");

</script>


</body>

</html>
